<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Catetin - Pencatat Pengeluaran Harian</title>
<meta name="description" content="Catat pengeluaran harian, atur budget per kategori, pantau kebiasaan, dan lacak progress berhenti merokok." />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#0B0F0D" id="themeColorMeta" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Catetin" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<style>
  :root {
    --bg: #0B0F0D;
    --bg-elev: #141A17;
    --card: #1A211D;
    --card-2: #212A25;
    --stroke: #2A332D;
    --ink: #F3F5F2;
    --muted: #8B9791;
    --faint: #5C665F;
    --mint: #2BE28F;
    --mint-dim: #1D9E63;
    --amber: #FFB020;
    --coral: #FF5D6C;
    --indigo: #6E7BFF;
    --ember: #C97B4A;
    --sky: #4FC3F7;
    --violet: #B18CFF;
    --teal: #35D0BA;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #F4F6F3;
    --bg-elev: #FFFFFF;
    --card: #FFFFFF;
    --card-2: #EEF1EC;
    --stroke: #DDE3DD;
    --ink: #17201A;
    --muted: #647167;
    --faint: #94A099;
    --shadow: 0 8px 24px rgba(20,30,25,0.1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 110px;
    min-height: 100vh;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .font-display { font-family: 'Space Grotesk', sans-serif; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 20px 16px 0; }
  .row-between { display: flex; justify-content: space-between; align-items: center; }
  svg { display: block; }
  button { font-family: inherit; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 9px; background: var(--mint);
    display: flex; align-items: center; justify-content: center; color: #0B0F0D; font-weight: 700; font-size: 14px;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .date-tag { font-size: 11px; color: var(--faint); text-align: right; }
  .streak-pill {
    display: flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 600; color: var(--amber);
    background: rgba(255,176,32,0.12); padding: 4px 9px 4px 7px; border-radius: 999px; margin-top: 4px; justify-content: flex-end;
  }

  /* Tabs */
  .tabpage { display: none; }
  .tabpage.active { display: block; }

  /* Hero card */
  .hero {
    position: relative;
    border-radius: 24px;
    padding: 24px 22px 22px;
    background: radial-gradient(120% 140% at 100% 0%, rgba(43,226,143,0.28) 0%, rgba(43,226,143,0) 55%), linear-gradient(160deg, #182620 0%, #0F1613 65%);
    border: 1px solid var(--stroke);
    overflow: hidden;
  }
  [data-theme="light"] .hero { background: radial-gradient(120% 140% at 100% 0%, rgba(43,226,143,0.16) 0%, rgba(43,226,143,0) 55%), linear-gradient(160deg, #EAF7EF 0%, #FFFFFF 65%); }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .hero-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
  .hero-amount { font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  .hero-amount.over { color: var(--coral); }
  .badge { font-size: 10.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; white-space: nowrap; display: inline-block; }
  .badge-ok { background: rgba(43,226,143,0.16); color: var(--mint); }
  .badge-warn { background: rgba(255,176,32,0.16); color: var(--amber); }
  .badge-over { background: rgba(255,93,108,0.16); color: var(--coral); }
  .badge-none { background: rgba(255,255,255,0.08); color: var(--muted); }
  [data-theme="light"] .badge-none { background: rgba(20,30,25,0.06); }

  .ring-wrap { position: relative; width: 84px; height: 84px; flex-shrink: 0; }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; }

  .hero-stats { display: flex; gap: 20px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
  [data-theme="light"] .hero-stats { border-top-color: rgba(20,30,25,0.08); }
  .hero-stat .lbl { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .hero-stat .val { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; }
  .hero-stat .val.trend-up { color: var(--coral); }
  .hero-stat .val.trend-down { color: var(--mint); }

  /* Section cards */
  .card { background: var(--card); border: 1px solid var(--stroke); border-radius: 20px; }
  .section { margin-top: 14px; padding: 16px; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-title .link-mini { text-transform: none; letter-spacing: 0; color: var(--mint); font-weight: 600; cursor: pointer; font-size: 11.5px; }

  /* Insight card */
  .insight-card { margin-top: 14px; padding: 16px; background: linear-gradient(155deg, rgba(110,123,255,0.14), rgba(110,123,255,0) 60%), var(--card); border: 1px solid var(--stroke); border-radius: 20px; }
  .insight-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .insight-head .ic { width: 26px; height: 26px; border-radius: 9px; background: rgba(110,123,255,0.18); color: var(--indigo); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .insight-head .ic svg { width: 14px; height: 14px; }
  .insight-head span { font-size: 12.5px; font-weight: 600; }
  .insight-list { display: flex; flex-direction: column; gap: 9px; }
  .insight-item { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.5; color: var(--ink); }
  .insight-item .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--indigo); margin-top: 7px; flex-shrink: 0; }
  .insight-item b { font-weight: 700; }
  .insight-empty { font-size: 12px; color: var(--faint); text-align: center; padding: 6px 0; }

  /* Quit smoking card */
  .quit-card { margin-top: 14px; padding: 18px; border-radius: 20px; border: 1px solid var(--stroke); background: linear-gradient(155deg, rgba(201,123,74,0.22), rgba(201,123,74,0) 65%), var(--card); position: relative; overflow: hidden; }
  .quit-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .quit-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ember); font-weight: 700; margin-bottom: 6px; }
  .quit-days { font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; }
  .quit-days span { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .quit-save { margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 12.5px; color: var(--muted); }
  [data-theme="light"] .quit-save { border-top-color: rgba(20,30,25,0.08); }
  .quit-save b { color: var(--ink); font-family: 'JetBrains Mono', monospace; font-size: 14px; }
  .quit-icon { width: 42px; height: 42px; border-radius: 13px; background: rgba(201,123,74,0.18); color: var(--ember); display: flex; align-items: center; justify-content: center; }
  .quit-icon svg { width: 20px; height: 20px; }
  .quit-cta { margin-top: 12px; width: 100%; background: var(--ember); color: #1A0F08; border: none; border-radius: 13px; padding: 11px; font-weight: 700; font-size: 12.5px; cursor: pointer; }
  .quit-relapse-warn { margin-top: 10px; background: rgba(255,93,108,0.12); border-radius: 12px; padding: 10px 12px; font-size: 11.5px; color: var(--coral); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .quit-relapse-warn button { background: var(--coral); color: #1A0B0C; border: none; border-radius: 8px; padding: 6px 10px; font-size: 11px; font-weight: 700; cursor: pointer; flex-shrink: 0; }

  /* Recurring due banner */
  .due-banner { margin-top: 14px; padding: 13px 14px; border-radius: 16px; background: rgba(255,176,32,0.1); border: 1px solid rgba(255,176,32,0.3); display: flex; align-items: center; gap: 10px; }
  .due-banner .ic { color: var(--amber); flex-shrink: 0; }
  .due-banner .txt { flex: 1; font-size: 12px; line-height: 1.4; }
  .due-banner .txt b { display: block; font-size: 12.5px; margin-bottom: 1px; }
  .due-banner button { background: var(--amber); color: #241B03; border: none; border-radius: 9px; padding: 7px 11px; font-size: 11px; font-weight: 700; cursor: pointer; flex-shrink: 0; }

  /* Heatmap */
  .heatmap-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; }
  .heat-cell { aspect-ratio: 1; border-radius: 5px; background: var(--card-2); position: relative; }
  .heat-cell.future { opacity: 0.3; }
  .heatmap-legend { display: flex; align-items: center; justify-content: flex-end; gap: 5px; margin-top: 10px; font-size: 9.5px; color: var(--faint); }
  .heatmap-legend .sq { width: 9px; height: 9px; border-radius: 3px; }

  /* Charts */
  .chart-flex { display: flex; align-items: center; gap: 14px; }
  .donut-wrap { width: 108px; height: 108px; flex-shrink: 0; position: relative; }
  .donut-wrap canvas { width: 100% !important; height: 100% !important; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .donut-center .n { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 700; }
  .donut-center .l { font-size: 9px; color: var(--muted); }
  .legend { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 12px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
  .legend-item .cname { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-item .cval { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; }
  .legend-item .cdelta { font-family: 'JetBrains Mono', monospace; font-size: 10px; flex-shrink: 0; }
  .legend-item .cdelta.up { color: var(--coral); }
  .legend-item .cdelta.down { color: var(--mint); }

  .bar-chart-box { width: 100%; height: 110px; position: relative; }
  .trend-chart-box { width: 100%; height: 150px; position: relative; }

  .segmented { display: flex; background: var(--card-2); border-radius: 12px; padding: 3px; margin-bottom: 14px; }
  .segmented button { flex: 1; border: none; background: transparent; color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 8px 4px; border-radius: 9px; cursor: pointer; }
  .segmented button.active { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  /* Budget bars */
  .budget-row { margin-bottom: 14px; }
  .budget-row:last-child { margin-bottom: 0; }
  .budget-row .row-between { font-size: 12.5px; margin-bottom: 6px; }
  .budget-row .cname { color: var(--ink); font-weight: 500; }
  .budget-row .cval { font-family: 'JetBrains Mono', monospace; color: var(--muted); font-size: 11.5px; }
  .bar-bg { height: 7px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }

  /* Search / filters */
  .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-box { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--stroke); border-radius: 14px; padding: 10px 12px; }
  .search-box svg { color: var(--faint); flex-shrink: 0; }
  .search-box input { border: none; outline: none; background: transparent; color: var(--ink); font-size: 13.5px; width: 100%; }
  .search-box input::placeholder { color: var(--faint); }
  .filter-chip-row { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
  .filter-chip { flex-shrink: 0; background: var(--card); border: 1px solid var(--stroke); color: var(--muted); font-size: 11.5px; font-weight: 600; padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .filter-chip.active { background: var(--mint); border-color: var(--mint); color: #0B0F0D; }

  /* History */
  .history { margin-top: 4px; }
  .day-group { margin-bottom: 18px; }
  .day-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 0 2px; }
  .day-head .lbl { font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .day-head .tot { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--faint); }
  .tx-list { background: var(--card); border: 1px solid var(--stroke); border-radius: 18px; overflow: hidden; }
  .tx-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--stroke); }
  .tx-row:last-child { border-bottom: none; }
  .tx-icon { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; }
  .tx-icon svg { width: 17px; height: 17px; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-info .main { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-info .sub { font-size: 11px; color: var(--faint); margin-top: 1px; }
  .tx-amt { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: 600; flex-shrink: 0; }
  .tx-del { background: none; border: none; color: var(--faint); cursor: pointer; padding: 6px; flex-shrink: 0; display: flex; }
  .tx-del svg { width: 15px; height: 15px; }
  .tx-del:hover { color: var(--coral); }
  .empty-state { text-align: center; padding: 44px 20px; font-size: 13px; color: var(--faint); }
  .empty-state svg { margin-bottom: 10px; opacity: 0.5; }

  .top-link-row { display: flex; justify-content: flex-end; margin-top: 10px; gap: 14px; }
  .link-btn { background: none; border: none; color: var(--mint); font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 6px 2px; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed; left: 0; right: 0; bottom: 0; height: 78px; background: var(--bg-elev); border-top: 1px solid var(--stroke);
    display: flex; align-items: center; justify-content: space-around; padding-bottom: env(safe-area-inset-bottom); z-index: 45;
  }
  .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--faint); cursor: pointer; padding: 6px 10px; }
  .nav-btn svg { width: 21px; height: 21px; }
  .nav-btn span { font-size: 9.5px; font-weight: 600; }
  .nav-btn.active { color: var(--mint); }
  .nav-fab-slot { width: 58px; }

  /* FAB */
  .fab {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 40px; width: 58px; height: 58px; border-radius: 18px;
    background: var(--mint); color: #0B0F0D; border: none; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(43,226,143,0.4); cursor: pointer; z-index: 46; transition: transform 0.15s ease;
  }
  .fab:active { transform: translateX(-50%) scale(0.93); }
  .fab svg { width: 26px; height: 26px; }

  /* Bottom sheets */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet {
    background: var(--bg-elev); border-radius: 26px 26px 0 0; width: 100%; max-width: 460px; padding: 8px 20px 24px;
    max-height: 88vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.32,0.72,0,1);
    border-top: 1px solid var(--stroke);
  }
  .sheet-bg.open .sheet { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; background: var(--stroke); border-radius: 999px; margin: 10px auto 16px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .sheet-head h2 { font-size: 18px; margin: 0; font-weight: 600; }
  .sheet-close { background: var(--card); border: none; width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); }

  .amount-input-row { display: flex; align-items: baseline; gap: 6px; padding: 10px 2px 18px; border-bottom: 1px solid var(--stroke); margin-bottom: 16px; }
  .amount-input-row span { font-family: 'Space Grotesk', sans-serif; color: var(--muted); font-size: 22px; font-weight: 600; }
  .amount-input-row input { flex: 1; border: none; outline: none; background: transparent; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; color: var(--ink); min-width: 0; }
  .amount-input-row input::placeholder { color: var(--faint); }

  .quick-chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 18px; padding-bottom: 2px; }
  .chip {
    flex-shrink: 0; background: var(--card); border: 1px solid var(--stroke); color: var(--ink); font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px; font-weight: 500; padding: 8px 14px; border-radius: 12px; cursor: pointer;
  }
  .chip:active { background: var(--card-2); }

  .field-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 10px; display: block; }
  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .cat-btn {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px; border-radius: 16px;
    border: 1.5px solid var(--stroke); background: var(--card); cursor: pointer;
  }
  .cat-btn .ic { width: 34px; height: 34px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .cat-btn .ic svg { width: 17px; height: 17px; }
  .cat-btn span.lbl { font-size: 9.5px; color: var(--muted); text-align: center; line-height: 1.2; }
  .cat-btn.active { border-color: var(--mint); background: rgba(43,226,143,0.08); }
  .cat-btn.active span.lbl { color: var(--ink); font-weight: 600; }
  .cat-btn.add-cat { border-style: dashed; color: var(--muted); }

  .rokok-calc { background: var(--card); border: 1px solid var(--stroke); border-radius: 14px; padding: 12px 14px; margin-bottom: 18px; }
  .rokok-calc .row-between { margin-bottom: 8px; }
  .rokok-calc .lbl { font-size: 12px; color: var(--muted); }
  .rokok-calc-inputs { display: flex; align-items: center; gap: 8p
